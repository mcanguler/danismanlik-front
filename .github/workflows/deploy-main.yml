name: Deploy Danismanlik Frontend Main

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 7474
          script: |
            cd /var/www/danismanlik/frontend/main
            git pull origin main
            rm -rf node_modules
            rm -rf .next
            npm install
            npm run build
            pm2 restart danismanlik-frontend-main